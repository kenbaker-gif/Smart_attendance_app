workflows:

  # ─────────────────────────────────────────────
  # ANDROID RELEASE  (Shorebird)
  # ─────────────────────────────────────────────
  android-release:
    name: Android Release (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        TERM: xterm-256color

        # ── Shorebird ──────────────────────────
        SHOREBIRD_TOKEN: $SHOREBIRD_TOKEN

        # ── .env contents (injected at build) ──
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        MVP_URL: $MVP_URL
        GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID

      android_signing:
        - faceattend_keystore

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Create .env file
        script: |
          export TERM=xterm-256color
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          MVP_URL=$MVP_URL
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          EOF
          echo "✓ .env file created"

      - name: Install Shorebird
        script: |
          export TERM=xterm-256color
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/shorebird/main/install.sh -sSf | bash
          echo export PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
          source $CM_ENV
          echo "✓ Shorebird installed: $(shorebird --version)"

      - name: Flutter pub get
        script: |
          export TERM=xterm-256color
          flutter pub get
          echo "✓ Dependencies resolved"

      - name: Generate launcher icons
        script: |
          export TERM=xterm-256color
          flutter pub run flutter_launcher_icons
          echo "✓ Launcher icons generated"

      - name: Shorebird Android release
        script: |
          export TERM=xterm-256color
          shorebird release android \
            --artifact apk \
            -- --release
          echo "✓ Shorebird release complete"

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal


  # ─────────────────────────────────────────────
  # ANDROID PATCH  (Shorebird hot-fix)
  # ─────────────────────────────────────────────
  android-patch:
    name: Android Patch (Shorebird)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        TERM: xterm-256color
        SHOREBIRD_TOKEN: $SHOREBIRD_TOKEN
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        MVP_URL: $MVP_URL
        GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID

    scripts:
      - name: Create .env file
        script: |
          export TERM=xterm-256color
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          MVP_URL=$MVP_URL
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          EOF
          echo "✓ .env file created"

      - name: Install Shorebird
        script: |
          export TERM=xterm-256color
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/shorebird/main/install.sh -sSf | bash
          echo export PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
          source $CM_ENV
          echo "✓ Shorebird installed"

      - name: Flutter pub get
        script: |
          export TERM=xterm-256color
          flutter pub get
          echo "✓ Dependencies resolved"

      - name: Shorebird Android patch
        script: |
          export TERM=xterm-256color
          shorebird patch android
          echo "✓ Shorebird patch complete"

    artifacts:
      - build/**/outputs/**/*.apk


  # ─────────────────────────────────────────────
  # iOS RELEASE  (ready when you have Apple account)
  # ─────────────────────────────────────────────
  ios-release:
    name: iOS Release (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        TERM: xterm-256color
        SHOREBIRD_TOKEN: $SHOREBIRD_TOKEN
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
        MVP_URL: $MVP_URL
        GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
        BUNDLE_ID: app.faceattend.mobile

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.faceattend.mobile

    scripts:
      - name: Create .env file
        script: |
          export TERM=xterm-256color
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          MVP_URL=$MVP_URL
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          EOF
          echo "✓ .env file created"

      - name: Install Shorebird
        script: |
          export TERM=xterm-256color
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/shorebird/main/install.sh -sSf | bash
          echo export PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
          source $CM_ENV
          echo "✓ Shorebird installed"

      - name: Flutter pub get
        script: |
          export TERM=xterm-256color
          flutter pub get
          echo "✓ Dependencies resolved"

      # Uncomment when ready for iOS icons
      # - name: Enable iOS icons
      #   script: |
      #     sed -i '' 's/ios: false/ios: true/' pubspec.yaml
      #     flutter pub run flutter_launcher_icons

      - name: Shorebird iOS release
        script: |
          export TERM=xterm-256color
          shorebird release ios \
            -- --release
          echo "✓ Shorebird iOS release complete"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true