name: Face_Attend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Biometric option
  local_auth: ^3.0.1

  # Authentication
  supabase_flutter: ^2.8.0 

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Storage (REQUIRED for security wrapper)
  shared_preferences: ^2.2.2

  # Core packages
  camera: ^0.12.0+1
  http: ^1.2.1
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_image_compress: ^2.3.0 
  flutter_dotenv: ^6.0.0
  image_picker: ^1.0.0
  wakelock_plus: ^1.4.0

  # Audit logging
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - shorebird.yaml
    - assets/icon.png